<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kamerki na stokach</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=5">
  <style>
    :root { --bg:#0f1720; --card:#18232f; --text:#e8eef4; --muted:#8aa0b3; --accent:#3b9eff; }
    @media (prefers-color-scheme: light) {
      :root { --bg:#f2f6fa; --card:#ffffff; --text:#14202b; --muted:#5b7080; --accent:#0a6ed1; }
    }
    * { box-sizing: border-box; }
    :root { --veil:rgba(8,18,32,.58); }
    @media (prefers-color-scheme: light) { :root { --veil:rgba(255,255,255,.12); } }
    body { margin:0; font-family: system-ui, sans-serif; color:var(--text); min-height:100vh;
           background:linear-gradient(var(--veil), var(--veil)), var(--bg) url(bg-alps.jpg?v=1) center / cover no-repeat fixed; }
    footer { max-width:1400px; margin:0 auto; padding:8px 16px 24px; font-size:.8rem; }
    footer span { display:inline-block; padding:4px 10px; border-radius:8px; background:var(--card); color:var(--text); opacity:.9; }
    footer a { color:inherit; }
    header { padding:24px 16px 8px; max-width:1400px; margin:0 auto; }
    h1 { margin:0 0 4px; font-size:1.6rem; display:flex; align-items:center; }
    .logo { width:44px; height:44px; margin-right:12px; flex:none; }
    header p { margin:0; color:var(--text); opacity:.8; }
    .bar { max-width:1400px; margin:0 auto; padding:12px 16px 0; display:flex; flex-wrap:wrap; }
    .bar button { margin:0 8px 8px 0; font:inherit; color:var(--text); background:var(--card);
                  border:2px solid transparent; border-radius:999px; padding:8px 18px; cursor:pointer; }
    .bar button { display:inline-flex; align-items:center; }
    .tabicon { width:24px; height:24px; margin-right:8px; border-radius:5px; object-fit:contain; background:#fff; }
    .bar button[aria-selected="true"] { border-color:var(--accent); font-weight:600; }
    .bar button:focus { outline:2px solid var(--accent); outline-offset:2px; }
    main { max-width:1400px; margin:0 auto; padding:16px;
           display:grid; gap:16px; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); }
    @media (min-width:1200px) { main { grid-template-columns:repeat(auto-fit, minmax(480px, 1fr)); } }
    figure { margin:0; background:var(--card); border-radius:12px; overflow:hidden; }
    .frame { position:relative; width:100%; height:0; padding-bottom:56.25%; background:#000; }
    .frame iframe, .frame img { position:absolute; top:0; left:0; right:0; bottom:0; width:100%; height:100%; border:0; object-fit:cover; }
    figcaption { padding:10px 14px; font-size:.95rem; display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; }
    figcaption a { color:var(--accent); text-decoration:none; font-weight:600; padding:6px 0 6px 12px; }
    figcaption a:focus { outline:2px solid var(--accent); }
    .playbtn { position:absolute; top:0; left:0; right:0; bottom:0; width:100%; height:100%; border:0; cursor:pointer;
               background:rgba(0,0,0,.35); color:#fff; font:inherit; font-size:1.6rem; font-weight:600; }
    .playbtn:focus { outline:4px solid var(--accent); outline-offset:-4px; }
  </style>
</head>
<body>
  <header>
    <h1><img class="logo" src="/favicon.svg?v=5" alt="" width="44" height="44">Kamerki na stokach</h1>
    <p>Podgląd na żywo z kilku stoków.</p>
  </header>
  <div class="bar" id="tabs" role="tablist" aria-label="Ośrodki"></div>
  <main id="cams"></main>
  <footer><span>Zdjęcie w tle: Chamonix, Alpy, <a href="https://www.pexels.com/photo/8253145/" target="_blank" rel="noopener">Pexels</a></span></footer>

  <script>
    // Dodaj ośrodek lub kamerę tutaj.
    //  id    = koniec adresu https://player.webcamera.pl/<id>
    //  src   = własny adres odtwarzacza (zamiast id), np. Camzone
    //  photo = zdjęcie kamery (plakat na TV; kamera bez odtwarzacza pokazuje tylko to zdjęcie)
    //  page  = strona kamery (przycisk "Otwórz na żywo")
    const RESORTS = [
      { key: "czarny-gron", name: "Czarny Groń", icon: "icons/czarny-gron.ico", cams: [
        { id: "czarnygron_cam_c0df65", name: "Rzyki – górna stacja", page: "https://czarnygron-stok2.webcamera.pl/" },
        { id: "czarnygron_cam_961902", name: "Magiczna Osada", page: "https://czarnygron-magiczna-osada.webcamera.pl/" },
      ]},
      { key: "master-ski", name: "Master Ski Tylicz", icon: "icons/master-ski.png", cams: [
        { id: "masterski_cam_557832", name: "Tylicz – kamera 1", page: "https://masterski-tylicz-3.webcamera.pl/" },
        { id: "masterski_cam_94c295", name: "Tylicz – kamera 2", page: "https://masterski-tylicz-2.webcamera.pl/" },
        { id: "masterski_cam_ce7d7b", name: "Tylicz – kamera 3", page: "https://masterski-tylicz.webcamera.pl/" },
        { id: "masterski_cam_0c8ddc", name: "Tylicz – kamera 4 (nowa)", page: "https://masterski-tylicz-4.webcamera.pl/" },
        { id: "masterski_cam_aabee6", name: "Tylicz – widok na wyciąg taśmowy", page: "https://master-ski.pl/kamery/" },
        { id: "masterski_cam_17fe2a", name: "Tylicz – kamera 6", page: "https://masterski-tylicz-5.webcamera.pl/" },
        { id: "masterski_cam_68446d", name: "Sport – nowa kolej krzesełkowa", page: "https://master-ski-sport.webcamera.pl/" },
      ]},
      { key: "slotwiny-arena", name: "Słotwiny Arena", icon: "icons/slotwiny-arena.png", cams: [
        { id: "moit_cam_90a8ae", name: "Słotwiny Arena – Krynica-Zdrój", page: "https://slotwinyarena-2.webcamera.pl/" },
        { id: "moit_cam_0b9f47", name: "Słotwiny Arena – widok z górnej stacji", page: "https://slotwinyarena.webcamera.pl/" },
        { id: "moit_cam_79802a", name: "Słotwiny Arena – kolej krzesełkowa Słotwinka", page: "https://slotwiny-arena-slotwinka.webcamera.pl/" },
        // bez odtwarzacza do osadzenia (webcamera.pl przekierowuje na widget): zdjęcie + link
        { name: "Kompleks Narciarski Słotwiny", photo: "https://imageserver.webcamera.pl/miniaturki/slotwiny_cam_9eda48.jpg", page: "https://slotwiny.webcamera.pl/" },
        // źródło: https://www.slotwiny.pl/kamery-on-line/ ; wideo tylko na stronie webcamera.pl (odtwarzacz iframe przekierowuje na widget)
        { name: "Kompleks Narciarski Słotwiny – dolna stacja", photo: "https://imageserver.webcamera.pl/miniaturki/skywind_cam_8ee981.jpg", page: "https://slotwiny2.webcamera.pl/" },
      ]},
      { key: "jaworzyna-krynicka", name: "Jaworzyna Krynicka", icon: "icons/jaworzyna-krynicka.png", cams: [
        // źródło: https://jaworzynakrynicka.pl/kamery-live/ (te same odtwarzacze webcamera.pl)
        { id: "skywind_cam_0d9bf2", name: "Jaworzyna – kamera 1", page: "https://jaworzynakrynicka.pl/kamery-live/" },
        { id: "skywind_cam_77d44a", name: "Jaworzyna – kamera 2", page: "https://jaworzynakrynicka.pl/kamery-live/" },
        { id: "skywind_cam_94b11d", name: "Jaworzyna – trasa nr 1", page: "https://jaworzynakrynicka.pl/kamery-live/" },
        { id: "skywind_cam_06b06f", name: "Jaworzyna – trasy nr 2", page: "https://jaworzynakrynicka.pl/kamery-live/" },
        { id: "skywind_cam_0136d4", name: "Jaworzyna – trasa 3", page: "https://jaworzynakrynicka.pl/kamery-live/" },
        { id: "skywind_cam_c222e9", name: "Jaworzyna – trasa niebieska nr 7", page: "https://jaworzynakrynicka.pl/kamery-live/" },
        { id: "skywind_cam_b8cc02", name: "Jaworzyna – kolej Harnaś Express", page: "https://jaworzynakrynicka.pl/kamery-live/" },
        { id: "skywind_cam_449b41", name: "Jaworzyna – dolna stacja", page: "https://jaworzynakrynicka.pl/kamery-live/" },
      ]},
      { key: "zieleniec", name: "Zieleniec", icon: "icons/zieleniec.png", cams: [
        { id: "skywind_cam_809945", name: "Winterpol W3 – górna stacja", page: "https://zieleniec.webcamera.pl/" },
        { id: "zieleniec_cam_b059be", name: "Winterpol W3", page: "https://zieleniec-2.webcamera.pl/" },
        { id: "zieleniec_cam_79fa00", name: "Winterpol W3 – dolna stacja", page: "https://zieleniec-3.webcamera.pl/" },
        { id: "zieleniec_cam_5a376f", name: "Stok W3 i W4 Winterpol", page: "https://zieleniec-5.webcamera.pl/" },
        { id: "zieleniec_cam_e77d95", name: "Winterpol – wyciąg W5", page: "https://zieleniec-6.webcamera.pl/" },
        { id: "gryglowka_cam_a7853c", name: "Gryglówka – stacja dolna", page: "https://gryglowka-zieleniec.webcamera.pl/" },
      ]},
      { key: "kamianna-ski", name: "Kamianna Ski", icon: "icons/kamianna-ski.png", cams: [
        { id: "kamiannaski_cam_290b91", name: "KamiannaSki – stok", page: "https://kamianna-ski.webcamera.pl/" },
      ]},
      { key: "bialka-tatrzanska", name: "Białka Tatrzańska", icon: "icons/bialka-tatrzanska.ico", cams: [
        // Kotelnica Białczańska: https://bialkatatrzanska.pl/kamery/ (te same odtwarzacze webcamera.pl)
        { id: "skywind_cam_772102", name: "Kotelnica Białczańska", page: "https://bialkatatrzanska.webcamera.pl/" },
        { id: "kotelnica_cam_0b240f", name: "Kotelnica – Remiaszów", page: "https://kotelnica.webcamera.pl/" },
        { id: "kotelnica_cam_d105f8", name: "Kotelnica – Jankulakowski Wierch", page: "https://kotelnica-jankulakowski.webcamera.pl/" },
        { id: "kotelnica_cam_ea8e3d", name: "Kotelnica – wyciąg Pasieka Express", page: "https://kotelnica-pasieka-express.webcamera.pl/" },
        // Bania i szkoła narciarska
        { id: "skywind_cam_6407df", name: "Bania – Białka Tatrzańska", page: "https://bialka-bania1.webcamera.pl/" },
        { id: "hotelbania_cam_104a70", name: "Bania – stok", page: "https://bania-stok.webcamera.pl/" },
        { id: "kotelnica_cam_e91305", name: "Stok – szkoła narciarska Kotelnica i Bania", page: "https://kotelnica-szkola-stok.webcamera.pl/" },
      ]},
      { key: "male-ciche", name: "Małe Ciche", icon: "icons/male-ciche.ico", cams: [
        // źródło: https://maleciche.com/stacja-narciarska/kamery-na-stoku (te same odtwarzacze webcamera.pl)
        { id: "maleciche_cam_779cbc", name: "Małe Ciche – panorama", page: "https://maleciche-2.webcamera.pl/" },
        { id: "maleciche_cam_ab9e0d", name: "Małe Ciche – widok na górną stację", page: "https://maleciche.webcamera.pl/" },
        { id: "maleciche_cam_46a963", name: "Małe Ciche – trasy", page: "https://maleciche-4.webcamera.pl/" },
        { id: "maleciche_cam_76acbe", name: "Małe Ciche – dolna stacja", page: "https://maleciche-3.webcamera.pl/" },
      ]},
      { key: "kiczera-ski", name: "Kiczera Ski", icon: "icons/kiczera-ski.png", cams: [
        // źródło: https://www.kiczeraski.pl/kamery/ (na razie nieaktywne w webcamera.pl: poza sezonem)
        { id: "kiczeraski_cam_2b0ef4", name: "Kiczera – kamera 1", page: "https://www.kiczeraski.pl/kamery/" },
        { id: "kiczeraski_cam_82a692", name: "Kiczera – kolej linowa", page: "https://kiczeraski.webcamera.pl/" },
        { id: "kiczeraski_cam_0b1dc1", name: "Kiczera – kamera 3", page: "https://www.kiczeraski.pl/kamery/" },
        { id: "kiczeraski_cam_73be2c", name: "Kiczera – kamera 4", page: "https://www.kiczeraski.pl/kamery/" },
      ]},
      // San Diego Zoo: oficjalny odtwarzacz Camzone (ten sam iframe, którego używa strona zoo)
      { key: "panda-san-diego", name: "Panda – San Diego Zoo", icon: "icons/panda-san-diego.ico", cams: [
        { name: "Giant Panda Cam – San Diego Zoo",
          src: "https://zssd-panda2024.secureplayer.camzonecdn.com/v1.3/CamzoneStreamPlayer?iframe=yes&channel=zssd-panda2024&muted=yes&mutebutton=no&czlogourl=&toolbar=always&backgroundcolor=000000&toolbarbgcolor=ffffff&toolbaralpha=100&toolbartextcolor=000000&epostcard=yes&toolbartype=new&toolbarposition=topright",
          photo: "https://zssd-panda2024.preview.api.camzonecdn.com/previewimage",
          page: "https://zoo.sandiegozoo.org/cams/giant-panda-cam" },
      ]},
    ];

    const tabs = document.getElementById("tabs");
    const root = document.getElementById("cams");
    let currentKey = null;
    let activeLive = null;

    // Telewizory (LG webOS, NetCast, inne Smart TV) mają sprzętowy dekoder na 1-2 strumienie naraz,
    // więc tam wideo startuje po kliknięciu i tylko jedna kamera naraz. ?tv=1 wymusza ten tryb.
    const IS_TV = /Web0S|webOS|NetCast|SmartTV|Colt\//i.test(navigator.userAgent) || /[?&]tv=1/.test(location.search);

    function photoUrl(cam) {
      if (cam.photo) return cam.photo + (cam.photo.indexOf("?") < 0 ? "?" : "&") + "t=" + Date.now();
      return "https://imageserver.webcamera.pl/miniaturki/" + encodeURIComponent(cam.id) + ".jpg?t=" + Date.now();
    }

    function makeIframe(cam) {
      const f = document.createElement("iframe");
      f.src = cam.src || ("https://player.webcamera.pl/" + encodeURIComponent(cam.id));
      f.title = cam.name;
      f.loading = "lazy";
      f.allowFullscreen = true;
      f.allow = "autoplay; fullscreen; picture-in-picture";
      f.setAttribute("frameborder", "0");
      return f;
    }

    function makePhoto(cam) {
      const img = document.createElement("img");
      img.alt = cam.name;
      img.src = photoUrl(cam);
      return img;
    }

    function render() {
      const resort = RESORTS.find(function (r) { return r.key === currentKey; }) || RESORTS[0];
      currentKey = resort.key;
      activeLive = null;

      Array.prototype.forEach.call(tabs.children, function (b) {
        b.setAttribute("aria-selected", String(b.dataset.key === currentKey));
      });

      while (root.firstChild) root.removeChild(root.firstChild);
      resort.cams.forEach(function (cam) {
        const fig = document.createElement("figure");
        const wrap = document.createElement("div");
        wrap.className = "frame";

        const playable = !!(cam.id || cam.src);
        if (!playable) {
          // kamera bez odtwarzacza do osadzenia: samo zdjęcie
          wrap.appendChild(makePhoto(cam));
        } else if (IS_TV) {
          // TV: zdjęcie + Odtwórz; uruchomienie jednej kamery zatrzymuje poprzednią
          const img = makePhoto(cam);
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "playbtn";
          btn.textContent = "▶ Odtwórz";
          btn.addEventListener("click", function () {
            if (activeLive) activeLive.stop();
            const f = makeIframe(cam);
            wrap.appendChild(f);
            img.style.display = "none";
            btn.style.display = "none";
            activeLive = { stop: function () {
              wrap.removeChild(f);
              img.style.display = "";
              btn.style.display = "";
            } };
          });
          wrap.appendChild(img);
          wrap.appendChild(btn);
        } else {
          wrap.appendChild(makeIframe(cam));
        }

        const cap = document.createElement("figcaption");
        const label = document.createElement("span");
        label.textContent = cam.name;
        cap.appendChild(label);
        const a = document.createElement("a");
        a.href = cam.page;
        a.target = "_blank";
        a.rel = "noopener";
        a.textContent = "Otwórz na żywo ↗";
        cap.appendChild(a);

        fig.appendChild(wrap);
        fig.appendChild(cap);
        root.appendChild(fig);
      });

      history.replaceState(null, "", "#" + currentKey);
    }

    RESORTS.forEach(function (r) {
      const b = document.createElement("button");
      b.type = "button";
      b.setAttribute("role", "tab");
      b.dataset.key = r.key;
      if (r.icon) {
        const ic = document.createElement("img");
        ic.src = r.icon;
        ic.alt = "";
        ic.className = "tabicon";
        b.appendChild(ic);
      }
      b.appendChild(document.createTextNode(r.name));
      b.addEventListener("click", function () { currentKey = r.key; render(); });
      tabs.appendChild(b);
    });

    currentKey = location.hash.slice(1);
    render();
  </script>
</body>
</html>
