<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kamerki na stokach</title>
  <style>
    :root { --bg:#0f1720; --card:#18232f; --text:#e8eef4; --muted:#8aa0b3; --accent:#3b9eff; }
    @media (prefers-color-scheme: light) {
      :root { --bg:#f2f6fa; --card:#ffffff; --text:#14202b; --muted:#5b7080; --accent:#0a6ed1; }
    }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--text); }
    header { padding:24px 16px 8px; max-width:1400px; margin:0 auto; }
    h1 { margin:0 0 4px; font-size:1.6rem; }
    header p { margin:0; color:var(--muted); }
    .bar { max-width:1400px; margin:0 auto; padding:12px 16px 0; display:flex; flex-wrap:wrap; justify-content:space-between; }
    .group { display:flex; flex-wrap:wrap; }
    .bar button { margin:0 8px 8px 0; font:inherit; color:var(--text); background:var(--card);
                  border:2px solid transparent; border-radius:999px; padding:8px 18px; cursor:pointer; }
    .bar button[aria-selected="true"], .bar button[aria-pressed="true"] { border-color:var(--accent); font-weight:600; }
    .bar button:focus { outline:2px solid var(--accent); outline-offset:2px; }
    main { max-width:1400px; margin:0 auto; padding:16px;
           display:grid; gap:16px; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); }
    @media (min-width:1200px) { main { grid-template-columns:repeat(auto-fit, minmax(480px, 1fr)); } }
    figure { margin:0; background:var(--card); border-radius:12px; overflow:hidden; }
    .frame { position:relative; width:100%; height:0; padding-bottom:56.25%; background:#000; }
    .frame iframe, .frame img { position:absolute; top:0; left:0; right:0; bottom:0; width:100%; height:100%; border:0; object-fit:cover; }
    figcaption { padding:10px 14px; font-size:.95rem; display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; }
    figcaption a { color:var(--accent); text-decoration:none; font-weight:600; padding:6px 0 6px 12px; }
    figcaption a:focus { outline:2px solid var(--accent); }
    .stamp { color:var(--muted); font-size:.8rem; }
    .frame .ph { position:absolute; top:0; left:0; right:0; bottom:0; display:flex; flex-direction:column;
                 align-items:center; justify-content:center; text-align:center; padding:12px; color:#fff;
                 background:linear-gradient(135deg,#1c2b3a,#0b1218); }
    .frame .ph b { font-size:1.15rem; margin-bottom:6px; }
    .frame .ph span { color:#b7c4d0; font-size:.9rem; }
    #dbg { display:none; position:fixed; left:0; right:0; bottom:0; max-height:45vh; overflow:auto; z-index:99;
           margin:0; padding:8px 12px; background:rgba(0,0,0,.92); color:#9fe870; font:14px/1.35 monospace; white-space:pre-wrap; }
    #dbg.on { display:block; }
  </style>
</head>
<body>
  <header>
    <h1>Kamerki na stokach</h1>
    <p>Podgląd na żywo z kilku stoków.</p>
  </header>
  <div class="bar">
    <div class="group" id="tabs" role="tablist" aria-label="Ośrodki"></div>
    <div class="group" id="modes" aria-label="Tryb podglądu"></div>
  </div>
  <main id="cams"></main>
  <pre id="dbg"></pre>

  <script>
    // Dodaj ośrodek lub kamerę tutaj.
    //  id   = koniec adresu https://player.webcamera.pl/<id> (to samo id jest w zdjęciu)
    //  page = strona kamery w webcamera.pl (przycisk "Otwórz na żywo")
    const RESORTS = [
      { key: "czarny-gron", name: "Czarny Groń", cams: [
        { id: "czarnygron_cam_c0df65", name: "Rzyki – górna stacja", page: "https://czarnygron-stok2.webcamera.pl/" },
      ]},
      { key: "master-ski", name: "Master Ski Tylicz", cams: [
        { id: "masterski_cam_557832", name: "Tylicz – kamera 1", page: "https://masterski-tylicz-3.webcamera.pl/" },
        { id: "masterski_cam_94c295", name: "Tylicz – kamera 2", page: "https://masterski-tylicz-2.webcamera.pl/" },
        { id: "masterski_cam_ce7d7b", name: "Tylicz – kamera 3", page: "https://masterski-tylicz.webcamera.pl/" },
        { id: "masterski_cam_0c8ddc", name: "Tylicz – kamera 4 (nowa)", page: "https://masterski-tylicz-4.webcamera.pl/" },
        { id: "masterski_cam_aabee6", name: "Tylicz – widok na wyciąg taśmowy", page: "https://master-ski.pl/kamery/" },
        { id: "masterski_cam_17fe2a", name: "Tylicz – kamera 6", page: "https://masterski-tylicz-5.webcamera.pl/" },
      ]},
      { key: "slotwiny-arena", name: "Słotwiny Arena", cams: [
        { id: "moit_cam_90a8ae", name: "Słotwiny Arena – Krynica-Zdrój", page: "https://slotwinyarena-2.webcamera.pl/" },
      ]},
      // Pandy z Chengdu (ipanda.com): brak osadzenia, tylko linki do kamer
      { key: "pandy-chengdu", name: "Pandy – Chengdu", cams: [
        { name: "Dorosła panda – kamera A", page: "https://en.ipanda.com/live/chengdu/01/" },
        { name: "Willa nr 1 – kamera A", page: "https://en.ipanda.com/live/chengdu/09/" },
        { name: "Willa nr 1 – kamera B", page: "https://en.ipanda.com/live/chengdu/10/" },
        { name: "Willa nr 6 – kamera A", page: "https://en.ipanda.com/live/chengdu/03/" },
        { name: "Willa nr 6 – kamera B", page: "https://en.ipanda.com/live/chengdu/04/" },
        { name: "Młode pandy – kamera A", page: "https://en.ipanda.com/live/chengdu/05/" },
        { name: "Młode pandy – kamera B", page: "https://en.ipanda.com/live/chengdu/06/" },
        { name: "Mama z młodymi – kamera A", page: "https://en.ipanda.com/live/chengdu/07/" },
        { name: "Mama z młodymi – kamera B", page: "https://en.ipanda.com/live/chengdu/08/" },
      ]},
    ];

    const REFRESH_MS = 30000;
    const tabs = document.getElementById("tabs");
    const modesEl = document.getElementById("modes");
    const root = document.getElementById("cams");
    let timer = null;
    let currentKey = null;

    // ---------- DEBUG ----------
    const dbgEl = document.getElementById("dbg");
    let debugOn = /Web0S|webOS/i.test(navigator.userAgent) || /[?&]debug=1/.test(location.search);
    const info = [];
    const logs = [];
    function paintDbg() {
      dbgEl.className = debugOn ? "on" : "";
      dbgEl.textContent = "DEBUG (wersja strony 7)\n" + info.join("\n") + "\n--- zdarzenia ---\n" + logs.join("\n");
      dbgEl.scrollTop = dbgEl.scrollHeight;
    }
    function dbg(msg) { logs.push(hhmm() + " " + msg); if (logs.length > 60) logs.shift(); paintDbg(); }
    window.onerror = function (m, src, line, col) { dbg("JS BŁĄD: " + m + " (" + line + ":" + col + ")"); };
    window.addEventListener("unhandledrejection", function (e) { dbg("PROMISE BŁĄD: " + (e.reason && e.reason.message || e.reason)); });

    (function collectInfo() {
      const ua = navigator.userAgent;
      info.push("UA: " + ua);
      info.push("Chrome: " + ((ua.match(/Chrome\/([\d.]+)/) || [])[1] || "?") + " | webOS: " + ((ua.match(/Web0S[^;)]*|webOS[^;)]*/i) || [])[0] || "-"));
      info.push("ekran: " + screen.width + "x" + screen.height + " | okno: " + innerWidth + "x" + innerHeight + " | dpr: " + devicePixelRatio);
      info.push("online: " + navigator.onLine + " | język: " + navigator.language);
      info.push("MediaSource: " + (typeof window.MediaSource !== "undefined") + " | WebRTC: " + (typeof window.RTCPeerConnection !== "undefined"));
      try { localStorage.setItem("kns-t", "1"); localStorage.removeItem("kns-t"); info.push("localStorage: OK"); }
      catch (e) { info.push("localStorage: BŁĄD " + e.message); }
      const v = document.createElement("video");
      info.push("HLS natywnie: " + (v.canPlayType("application/vnd.apple.mpegurl") || "nie") +
                " | mp4: " + (v.canPlayType('video/mp4; codecs="avc1.42E01E, mp4a.40.2"') || "nie"));
      const types = [
        ["H.264 baseline", 'video/mp4; codecs="avc1.42E01E"'],
        ["H.264 main 3.1", 'video/mp4; codecs="avc1.4D401F"'],
        ["H.264 high 4.0 (1080p)", 'video/mp4; codecs="avc1.640028"'],
        ["H.264 high 5.1 (4K)", 'video/mp4; codecs="avc1.640033"'],
        ["HEVC hvc1", 'video/mp4; codecs="hvc1.1.6.L93.B0"'],
        ["HEVC hev1", 'video/mp4; codecs="hev1.1.6.L120.90"'],
        ["VP9", 'video/webm; codecs="vp09.00.10.08"'],
        ["AV1", 'video/mp4; codecs="av01.0.05M.08"'],
        ["AAC", 'audio/mp4; codecs="mp4a.40.2"'],
      ];
      const out = types.map(function (t) {
        let ok = "brak MSE";
        try { if (window.MediaSource) ok = MediaSource.isTypeSupported(t[1]) ? "TAK" : "nie"; } catch (e) { ok = "błąd"; }
        return t[0] + ": " + ok;
      });
      info.push("Kodeki (MSE): " + out.join(" | "));
      if (navigator.mediaCapabilities && navigator.mediaCapabilities.decodingInfo) {
        [["1080p H.264", 'video/mp4; codecs="avc1.640028"', 1920, 1080], ["4K H.264", 'video/mp4; codecs="avc1.640033"', 3840, 2160], ["1080p HEVC", 'video/mp4; codecs="hvc1.1.6.L93.B0"', 1920, 1080]].forEach(function (c) {
          navigator.mediaCapabilities.decodingInfo({ type: "media-source", video: { contentType: c[1], width: c[2], height: c[3], bitrate: 6000000, framerate: 30 } })
            .then(function (r) { info.push("decode " + c[0] + ": obsługa=" + r.supported + " płynnie=" + r.smooth + " sprzętowo=" + r.powerEfficient); paintDbg(); })
            .catch(function (e) { info.push("decode " + c[0] + ": błąd " + e.message); paintDbg(); });
        });
      } else { info.push("mediaCapabilities: brak"); }
    })();
    let mode = "live";
    // Telewizory LG (webOS): wideo z części kamer się nie odtwarza, więc domyślnie pokazuj zdjęcia
    if (/Web0S|webOS/i.test(navigator.userAgent)) mode = "photo";
    try {
      const saved = localStorage.getItem("kns-mode");
      if (saved === "photo" || saved === "live") mode = saved;
    } catch (e) {}

    function photoUrl(id) {
      return "https://imageserver.webcamera.pl/miniaturki/" + encodeURIComponent(id) + ".jpg?t=" + Date.now();
    }
    function hhmm() {
      const d = new Date();
      return ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2) + ":" + ("0" + d.getSeconds()).slice(-2);
    }

    function render() {
      const resort = RESORTS.find(function (r) { return r.key === currentKey; }) || RESORTS[0];
      currentKey = resort.key;
      if (timer) { clearInterval(timer); timer = null; }

      Array.prototype.forEach.call(tabs.children, function (b) {
        b.setAttribute("aria-selected", String(b.dataset.key === currentKey));
      });
      Array.prototype.forEach.call(modesEl.children, function (b) {
        b.setAttribute("aria-pressed", String(b.dataset.mode === mode));
      });

      while (root.firstChild) root.removeChild(root.firstChild);
      const photos = [];
      resort.cams.forEach(function (cam) {
        const fig = document.createElement("figure");
        const wrap = document.createElement("div");
        wrap.className = "frame";

        if (!cam.id) {
          // kamera bez osadzenia: karta z linkiem do strony źródłowej
          const ph = document.createElement("div");
          ph.className = "ph";
          const b1 = document.createElement("b");
          b1.textContent = cam.name;
          const s1 = document.createElement("span");
          s1.textContent = "Transmisja tylko na stronie źródłowej";
          ph.appendChild(b1);
          ph.appendChild(s1);
          wrap.appendChild(ph);
        } else if (mode === "live") {
          const f = document.createElement("iframe");
          f.src = "https://player.webcamera.pl/" + encodeURIComponent(cam.id);
          f.title = cam.name;
          f.loading = "lazy";
          f.allowFullscreen = true;
          f.allow = "autoplay; fullscreen; picture-in-picture";
          f.setAttribute("frameborder", "0");
          const t0 = Date.now();
          f.onload = function () { dbg("iframe OK " + cam.id + " (" + (Date.now() - t0) + " ms)"); };
          f.onerror = function () { dbg("iframe BŁĄD " + cam.id); };
          wrap.appendChild(f);
        } else {
          const img = document.createElement("img");
          img.alt = cam.name;
          const t1 = Date.now();
          img.onload = function () { dbg("zdjęcie OK " + cam.id + " " + img.naturalWidth + "x" + img.naturalHeight + " (" + (Date.now() - t1) + " ms)"); };
          img.onerror = function () { dbg("zdjęcie BŁĄD " + cam.id); };
          img.src = photoUrl(cam.id);
          wrap.appendChild(img);
          photos.push({ id: cam.id, img: img });
        }

        const cap = document.createElement("figcaption");
        const label = document.createElement("span");
        label.textContent = cam.name + " ";
        if (mode === "photo" && cam.id) {
          const st = document.createElement("span");
          st.className = "stamp";
          st.textContent = "(" + hhmm() + ")";
          label.appendChild(st);
          photos[photos.length - 1].stamp = st;
        }
        cap.appendChild(label);
        const a = document.createElement("a");
        a.href = cam.page;
        a.target = "_blank";
        a.rel = "noopener";
        a.textContent = "Otwórz na żywo ↗";
        cap.appendChild(a);

        fig.appendChild(wrap);
        fig.appendChild(cap);
        root.appendChild(fig);
      });

      if (photos.length) {
        timer = setInterval(function () {
          photos.forEach(function (p) { p.img.src = photoUrl(p.id); p.stamp.textContent = "(" + hhmm() + ")"; });
        }, REFRESH_MS);
      }
      history.replaceState(null, "", "#" + currentKey);
    }

    RESORTS.forEach(function (r) {
      const b = document.createElement("button");
      b.type = "button";
      b.setAttribute("role", "tab");
      b.dataset.key = r.key;
      b.textContent = r.name;
      b.addEventListener("click", function () { currentKey = r.key; render(); });
      tabs.appendChild(b);
    });

    [["live", "Wideo na żywo"], ["photo", "Zdjęcia (co 30 s)"]].forEach(function (m) {
      const b = document.createElement("button");
      b.type = "button";
      b.dataset.mode = m[0];
      b.textContent = m[1];
      b.addEventListener("click", function () {
        mode = m[0];
        try { localStorage.setItem("kns-mode", mode); } catch (e) {}
        render();
      });
      modesEl.appendChild(b);
    });

    const dbgBtn = document.createElement("button");
    dbgBtn.type = "button";
    dbgBtn.textContent = "Debug";
    dbgBtn.addEventListener("click", function () { debugOn = !debugOn; paintDbg(); });
    modesEl.appendChild(dbgBtn);

    currentKey = location.hash.slice(1);
    dbg("start, tryb: " + mode);
    render();
  </script>
</body>
</html>
