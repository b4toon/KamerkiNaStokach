<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jednostki miary</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=5">
  <style>
    :root { color-scheme: dark light; --bg:#0f1720; --card:#18232f; --text:#e8eef4; --muted:#93a4b3; --accent:#4aa3ff;
            --a:#2d6fb7; --b:#ffb347; --line:#0f1720; }
    @media (prefers-color-scheme: light) {
      :root { --bg:#f2f6fa; --card:#ffffff; --text:#14202b; --muted:#5b7080; --accent:#0a6ed1; --a:#3a8de0; --b:#ffb347; --line:#ffffff; }
    }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui, sans-serif; color:var(--text); background:var(--bg); min-height:100vh; }
    .wrap { max-width:1200px; margin:0 auto; padding:16px; }
    h1 { font-size:1.6rem; margin:8px 0 4px; }
    p { margin:0 0 16px; color:var(--muted); }
    a { color:var(--accent); font-weight:600; text-decoration:none; }
    a:focus { outline:2px solid var(--accent); }
    .card { background:var(--card); border-radius:12px; padding:12px 16px 4px; margin-bottom:16px; }
    .card h2 { font-size:1rem; margin:0 0 6px; }
    svg { display:block; width:100%; height:auto; }
    .t { fill:var(--text); font-size:13px; text-anchor:middle; }
    .lab { fill:var(--muted); font-size:12px; text-anchor:middle; }
  </style>
</head>
<body>
  <div class="wrap">
    <p><a href="/">← Kamerki na stokach</a></p>
    <h1>Jednostki miary</h1>
    <p>Każdy pasek jest rozwinięciem poprzedniego (skala jest poglądowa, nie 1:1 na ekranie).</p>
    <div id="out"></div>
  </div>

  <script>
    var NS = "http://www.w3.org/2000/svg";
    function s(tag, attrs, parent) {
      var e = document.createElementNS(NS, tag);
      for (var k in attrs) e.setAttribute(k, attrs[k]);
      if (parent) parent.appendChild(e);
      return e;
    }
    function text(svg, cls, x, y, str) {
      var t = s("text", { "class": cls, x: x, y: y }, svg);
      t.textContent = str;
    }
    function card(title, h) {
      var c = document.createElement("div");
      c.className = "card";
      var t = document.createElement("h2");
      t.textContent = title;
      c.appendChild(t);
      var svg = s("svg", { viewBox: "0 0 1000 " + h });
      c.appendChild(svg);
      document.getElementById("out").appendChild(c);
      return svg;
    }
    // pasek z n równymi blokami; co `big` blok grubsza kreska; podpisy co `every`
    function bar(svg, y, h, n, labelFn, every, big) {
      var w = 1000 / n;
      for (var i = 0; i < n; i++) {
        s("rect", { x: i * w, y: y, width: w, height: h, fill: i % 2 ? "var(--b)" : "var(--a)" }, svg);
      }
      for (var j = 0; j <= n; j++) {
        var thick = big && j % big === 0;
        var x = Math.min(999.5, Math.max(0.5, j * w));
        s("line", { x1: x, x2: x, y1: y, y2: y + h + (thick ? 8 : 0), stroke: "var(--text)", "stroke-width": thick ? 2 : 1 }, svg);
      }
      for (var k = 0; k < n; k++) {
        if (every && k % every === 0 || !every) text(svg, "t", k * w + w / 2, y + h / 2 + 5, labelFn(k));
      }
    }

    // 1 m
    var a = card("1 metr (1 m)", 70);
    bar(a, 8, 40, 1, function () { return "1 m = 100 cm = 1000 mm"; });
    text(a, "lab", 500, 66, "1 m");

    // 10 x dm
    var b = card("10 × decymetr (1 dm = 10 cm)", 70);
    bar(b, 8, 40, 10, function (i) { return (i + 1) + " dm"; });
    text(b, "lab", 500, 66, "10 dm = 1 m");

    // 100 cm
    var c = card("100 × centymetr (1 cm = 10 mm)", 100);
    bar(c, 8, 40, 100, function (i) { return ""; }, 0, 10);
    for (var i = 10; i <= 100; i += 10) text(c, "t", (i - 5) * 10, 70, i + " cm");
    text(c, "lab", 500, 94, "100 cm = 1 m");

    // 1 cm = 10 mm (powiększenie pierwszego centymetra)
    var d = card("1 centymetr = 10 × milimetr (powiększenie)", 140);
    s("polygon", { points: "0,8 10,8 1000,70 0,70", fill: "var(--accent)", opacity: ".25" }, d);
    bar(d, 70, 40, 10, function (i) { return (i + 1) + " mm"; });
    text(d, "lab", 500, 132, "1 cm = 10 mm");
    text(d, "lab", 500, 48, "▼ powiększony pierwszy centymetr ▼");
  </script>
</body>
</html>
