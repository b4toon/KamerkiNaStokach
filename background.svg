<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice">
  <style>
    :root { --sky1:#07182c; --sky2:#2d5d8f; --far:#3a5f88; --mid:#2a4766; --near:#1b3249; --snow:#e8f1fa; --pine:#0e2235; --orb:#f4f1d8; --stars:.85; }
    @media (prefers-color-scheme: light) {
      :root { --sky1:#6fb0e6; --sky2:#dcedfb; --far:#9db9d6; --mid:#7f9dbb; --near:#6584a3; --snow:#ffffff; --pine:#3f5d77; --orb:#fff6c9; --stars:0; }
    }
    .far { fill:var(--far) } .mid { fill:var(--mid) } .near { fill:var(--near) }
    .snow { fill:var(--snow) } .pine { fill:var(--pine) }
    .star { fill:#fff; opacity:var(--stars) }
  </style>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--sky1)" style="stop-color:var(--sky1)"/>
      <stop offset="1" stop-color="var(--sky2)" style="stop-color:var(--sky2)"/>
    </linearGradient>
    <g id="cap"><path d="M0 0L-28 36L-10 30L4 46L18 30L34 38Z"/></g>
    <g id="tree">
      <rect x="-2.5" y="52" width="5" height="9" class="pine"/>
      <polygon points="0,0 -13,30 13,30" class="pine"/>
      <polygon points="0,16 -17,50 17,50" class="pine"/>
    </g>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- gwiazdy (tylko ciemny motyw) i księżyc/słońce -->
  <g class="star">
    <circle cx="90" cy="70" r="1.8"/><circle cx="210" cy="140" r="1.4"/><circle cx="340" cy="60" r="2"/>
    <circle cx="470" cy="150" r="1.5"/><circle cx="620" cy="80" r="1.8"/><circle cx="760" cy="40" r="1.4"/>
    <circle cx="900" cy="120" r="2"/><circle cx="1040" cy="60" r="1.5"/><circle cx="1180" cy="150" r="1.8"/>
    <circle cx="1450" cy="70" r="1.6"/><circle cx="1540" cy="170" r="1.4"/><circle cx="560" cy="210" r="1.3"/>
  </g>
  <circle cx="1500" cy="130" r="42" style="fill:var(--orb)" opacity=".95"/>

  <!-- góry w oddali -->
  <path class="far" d="M0 560L120 430L190 480L300 360L380 440L470 390L600 520L720 400L820 470L950 330L1050 450L1150 400L1280 500L1400 380L1500 450L1600 410V900H0Z"/>
  <g class="snow" opacity=".95">
    <use href="#cap" x="120" y="430"/><use href="#cap" x="300" y="360"/><use href="#cap" x="470" y="390"/>
    <use href="#cap" x="720" y="400"/><use href="#cap" x="950" y="330"/><use href="#cap" x="1150" y="400"/>
    <use href="#cap" x="1400" y="380"/>
  </g>

  <!-- góry bliżej -->
  <path class="mid" d="M0 650L140 540L260 610L400 500L520 600L660 520L800 640L930 540L1080 630L1220 520L1360 610L1480 540L1600 600V900H0Z"/>
  <g class="snow" opacity=".92">
    <use href="#cap" x="140" y="540" transform="translate(-14 -2) scale(.8) translate(35 0)"/>
    <use href="#cap" x="400" y="500"/><use href="#cap" x="660" y="520"/>
    <use href="#cap" x="930" y="540"/><use href="#cap" x="1220" y="520"/><use href="#cap" x="1480" y="540"/>
  </g>

  <!-- wzgórze z lasem -->
  <path class="near" d="M0 770Q260 690 560 745T1180 720T1600 700V900H0Z"/>
  <g>
    <use href="#tree" transform="translate(60 735) scale(.9)"/>
    <use href="#tree" transform="translate(130 722) scale(1.15)"/>
    <use href="#tree" transform="translate(205 730) scale(.8)"/>
    <use href="#tree" transform="translate(330 712) scale(1.05)"/>
    <use href="#tree" transform="translate(410 724) scale(.85)"/>
    <use href="#tree" transform="translate(1010 705) scale(1)"/>
    <use href="#tree" transform="translate(1090 692) scale(1.2)"/>
    <use href="#tree" transform="translate(1175 700) scale(.85)"/>
    <use href="#tree" transform="translate(1300 688) scale(1.1)"/>
    <use href="#tree" transform="translate(1385 676) scale(.9)"/>
    <use href="#tree" transform="translate(1490 672) scale(1.25)"/>
  </g>

  <!-- śnieżny stok z trasą zjazdową -->
  <path class="snow" d="M0 830Q420 770 820 810T1600 770V900H0Z"/>
  <path d="M-20 900Q380 810 760 840T1620 800" fill="none" stroke="#9ec6ea" stroke-width="10" stroke-linecap="round" opacity=".45"/>
  <path d="M-20 900Q380 810 760 840T1620 800" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 14" opacity=".9"/>
</svg>
